[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "piano-app"
version = "0.1.0"
description = "Backend for the piano application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "google-auth[requests]>=2.40",
    "PyJWT>=2.10",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "mypy>=1.20",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pre-commit>=4.2",
    "httpx>=0.28",
    "anyio",
    "fakeredis>=2.26",
    "lupa>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/piano_app"]

[tool.ruff]
src = ["src"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "N", "I", "B", "UP", "RUF", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
mypy_path = ["src"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated tests",
    "integration: tests that touch external systems",
    "end-to-end: tests that cover entire use cases",
]
